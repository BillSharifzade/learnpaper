# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). On a Mac:
#   brew install xcodegen
#   cd ios && xcodegen generate && open LearnPaper.xcodeproj
# Set DEVELOPMENT_TEAM below (or in Xcode) before running on a device. The App Group id must
# match Store.appGroup and be enabled for both bundle ids in your developer account.
name: LearnPaper
options:
  bundleIdPrefix: com.learnpaper
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    # Localizable.xcstrings is generated by tools/sync_strings.py; keep Xcode from adding keys to it.
    SWIFT_EMIT_LOC_STRINGS: NO

# Shared sources and resources compiled into both targets: Shared/ (code, the string catalog, the
# licence texts and the en/ru/tg .lproj folders that make Xcode list the three languages), the
# content pack built by content/scripts/build.py and the two brand fonts, taken from the Android
# assets so the repository holds one copy of each.
targetTemplates:
  SharedCode:
    sources:
      - path: Shared
      - path: ../content/build/words.json
        buildPhase: resources
      - path: ../content/build/images
        type: folder
        buildPhase: resources
      - path: ../android/app/src/main/assets/fonts/Onest-Variable.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/fonts/Inter-Variable.ttf
        buildPhase: resources

targets:
  LearnPaper:
    type: application
    platform: iOS
    templates: [SharedCode]
    sources:
      # Includes Assets.xcassets (AppIcon, AccentColor, BrandMark, LaunchBackground).
      - path: LearnPaper
        excludes: ["*.entitlements"]
    dependencies:
      - target: LearnPaperWidget
        embed: true
    entitlements:
      path: LearnPaper/LearnPaper.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnpaper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LearnPaper
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: LearnPaper/Info.plist
      properties:
        CFBundleDisplayName: LearnPaper
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tg, ru, en]
        UIAppFonts: [Onest-Variable.ttf, Inter-Variable.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false

  LearnPaperWidget:
    type: app-extension
    platform: iOS
    templates: [SharedCode]
    sources:
      - path: LearnPaperWidget
        excludes: ["*.entitlements"]
    entitlements:
      path: LearnPaperWidget/LearnPaperWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnpaper.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: LearnPaper
    info:
      path: LearnPaperWidget/Info.plist
      properties:
        CFBundleDisplayName: LearnPaper
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [tg, ru, en]
        UIAppFonts: [Onest-Variable.ttf, Inter-Variable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
